asyncapi: 3.0.0
info:
  title: SWAR security WebSocket API
  version: 1.0.0
  description: Authenticated tenant-scoped security events at /ws/security. Outbound risk events are not rate limited.
servers:
  native:
    host: localhost:3000
    pathname: /ws/security
    protocol: ws
    security:
      - $ref: '#/components/securitySchemes/userAccessToken'
channels:
  security:
    address: /ws/security
    messages:
      subscribe:
        $ref: '#/components/messages/Subscribe'
      acknowledge:
        $ref: '#/components/messages/Acknowledge'
      ready:
        $ref: '#/components/messages/Ready'
      subscribed:
        $ref: '#/components/messages/Subscribed'
      acknowledged:
        $ref: '#/components/messages/Acknowledged'
      error:
        $ref: '#/components/messages/Error'
      riskStateChanged:
        $ref: '#/components/messages/SecurityEvent'
operations:
  subscribeToCalls:
    action: send
    channel: { $ref: '#/channels/security' }
    messages:
      - $ref: '#/channels/security/messages/subscribe'
  acknowledgeEvent:
    action: send
    channel: { $ref: '#/channels/security' }
    messages:
      - $ref: '#/channels/security/messages/acknowledge'
  receiveSecurityEvents:
    action: receive
    channel: { $ref: '#/channels/security' }
    messages:
      - $ref: '#/channels/security/messages/ready'
      - $ref: '#/channels/security/messages/subscribed'
      - $ref: '#/channels/security/messages/acknowledged'
      - $ref: '#/channels/security/messages/error'
      - $ref: '#/channels/security/messages/riskStateChanged'
components:
  securitySchemes:
    userAccessToken:
      type: httpApiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: Offer swar.security.v1 and swar.bearer.<access JWT>; Authorization Bearer is also accepted for non-browser clients.
  messages:
    Subscribe:
      name: security.subscribe
      payload:
        type: object
        additionalProperties: false
        required: [callIds]
        properties:
          callIds:
            type: array
            minItems: 1
            uniqueItems: true
            items: { type: string, format: uuid }
          afterEventId:
            type: string
            pattern: '^evt_[0-9a-f]{64}$'
    Acknowledge:
      name: security.ack
      payload:
        type: object
        additionalProperties: false
        required: [eventId]
        properties:
          eventId: { type: string, pattern: '^evt_[0-9a-f]{64}$' }
    Ready:
      name: security.ready
      payload:
        type: object
        additionalProperties: false
        required: [schemaVersion, replayMaximum]
        properties:
          schemaVersion: { const: '1.0.0' }
          replayMaximum: { type: integer, minimum: 1 }
    Subscribed:
      name: security.subscribed
      payload:
        type: object
        additionalProperties: false
        required: [callIds, replayStatus, replayedCount, oldestAvailableEventId, latestAvailableEventId]
        properties:
          callIds:
            type: array
            minItems: 1
            uniqueItems: true
            items: { type: string, format: uuid }
          replayStatus: { enum: [COMPLETE, BOUNDARY_EXCEEDED] }
          replayedCount: { type: integer, minimum: 0 }
          oldestAvailableEventId:
            oneOf:
              - { type: string, pattern: '^evt_[0-9a-f]{64}$' }
              - { type: 'null' }
          latestAvailableEventId:
            oneOf:
              - { type: string, pattern: '^evt_[0-9a-f]{64}$' }
              - { type: 'null' }
    Acknowledged:
      name: security.acknowledged
      payload:
        type: object
        additionalProperties: false
        required: [eventId]
        properties:
          eventId: { type: string, pattern: '^evt_[0-9a-f]{64}$' }
    Error:
      name: security.error
      payload:
        type: object
        additionalProperties: false
        required: [code, message]
        properties:
          code: { enum: [SUBSCRIPTION_INVALID, SUBSCRIPTION_FORBIDDEN, ACK_INVALID] }
          message: { const: The WebSocket request was rejected. }
    SecurityEvent:
      name: versionedSecurityEvent
      payload:
        $ref: ./schemas/security-event.v1.json
