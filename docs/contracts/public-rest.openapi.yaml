  "info": {
    "title": "SWAR REST and callback API",
    "description": "Versioned contracts for authenticated users, internal services, and signed LiveKit webhooks. Examples are fictional.",
    "version": "1.0.0",
    "contact": {}
  },
  "tags": [],
  "servers": [
    {
      "url": "/api/v1",
      "description": "Versioned SWAR API base path"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearer": {
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "type": "http"
      },
      "mlService": {
        "type": "http",
        "scheme": "bearer"
      },
      "verifierService": {
        "type": "http",
        "scheme": "bearer"
      },
      "liveKitWebhook": {
        "type": "apiKey",
        "in": "header",
        "name": "Authorization"
      }
    },
    "schemas": {
      "CreateCallDto": {
        "type": "object",
        "properties": {
          "riskPolicyId": {
            "type": "string",
            "format": "uuid"
          },
          "riskPolicyVersion": {
            "type": "string",
            "maxLength": 40
          },
          "expectedTrustedSpeakerId": {
            "type": "string",
            "format": "uuid"
          },
          "protectedActionReference": {
            "type": "string",
            "maxLength": 160
          },
          "maximumParticipants": {
            "type": "number",
            "minimum": 2,
            "maximum": 20
          }
        },
        "required": [
          "riskPolicyId",
          "riskPolicyVersion",
          "maximumParticipants"
        ]
      },
      "InviteParticipantDto": {
        "type": "object",
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "CALLER",
              "CUSTOMER",
              "OBSERVER"
            ]
          },
          "membershipId": {
            "type": "string",
            "format": "uuid"
          },
          "trustedSpeakerId": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": "string",
            "maxLength": 160
          }
        },
        "required": [
          "role"
        ]
      },
      "JoinCallDto": {
        "type": "object",
        "properties": {
          "participantId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "participantId"
        ]
      },
      "CreateTrustedSpeakerDto": {
        "type": "object",
        "properties": {
          "label": {
            "type": "string",
            "maxLength": 160
          },
          "userId": {
            "type": "string",
            "format": "uuid"
          },
          "externalReference": {
            "type": "string",
            "maxLength": 160
          }
        },
        "required": [
          "label"
        ]
      },
      "GrantConsentDto": {
        "type": "object",
        "properties": {
          "purposeCode": {
            "type": "string",
            "example": "expected-speaker-verification"
          },
          "noticeVersion": {
            "type": "string",
            "example": "notice-v1"
          },
          "consentAffirmed": {
            "type": "boolean",
            "enum": [
              true
            ],
            "description": "Must be explicitly true."
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "purposeCode",
          "noticeVersion",
          "consentAffirmed"
        ]
      },
      "RevokeConsentDto": {
        "type": "object",
        "properties": {
          "reasonCode": {
            "type": "string",
            "maxLength": 80
          }
        },
        "required": [
          "reasonCode"
        ]
      },
      "MlEvidenceDto": {
        "type": "object",
        "properties": {
          "eventType": {
            "type": "string",
            "enum": [
              "FAST",
              "DEEP",
              "INSUFFICIENT_EVIDENCE",
              "PIPELINE_ERROR"
            ]
          },
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "schemaVersion": {
            "type": "string",
            "example": "1.0.0"
          },
          "organizationId": {
            "type": "string",
            "format": "uuid"
          },
          "callId": {
            "type": "string",
            "format": "uuid"
          },
          "analysisSessionId": {
            "type": "string",
            "format": "uuid"
          },
          "trackBindingId": {
            "type": "string",
            "format": "uuid"
          },
          "eventSequence": {
            "type": "string",
            "pattern": "^\\d+$"
          },
          "windowSequence": {
            "type": "string",
            "pattern": "^\\d+$"
          },
          "revision": {
            "type": "number",
            "minimum": 0
          },
          "evidenceType": {
            "type": "string",
            "enum": [
              "IDENTITY",
              "SPOOF_FAST",
              "SPOOF_DEEP",
              "AUDIO_QUALITY",
              "INSUFFICIENT_EVIDENCE",
              "PIPELINE_ERROR"
            ]
          },
          "windowStartMs": {
            "type": "string",
            "pattern": "^\\d+$"
          },
          "windowEndMs": {
            "type": "string",
            "pattern": "^\\d+$"
          },
          "observedAt": {
            "type": "string",
            "format": "date-time"
          },
          "processingLatencyMs": {
            "type": "number",
            "minimum": 0
          },
          "speechDurationMs": {
            "type": "number",
            "minimum": 0
          },
          "qualityScore": {
            "type": "number"
          },
          "reasonCodes": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "modelVersionId": {
            "type": "string",
            "format": "uuid"
          },
          "modelName": {
            "type": "string"
          },
          "modelVersion": {
            "type": "string"
          },
          "checkpointHashSha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "scoreName": {
            "type": "string"
          },
          "scoreDirection": {
            "type": "string",
            "enum": [
              "HIGHER_MEANS_MORE",
              "LOWER_MEANS_MORE",
              "NOT_APPLICABLE"
            ]
          },
          "rawScore": {
            "type": "number"
          },
          "calibratedScore": {
            "type": "number"
          },
          "calibrationVersion": {
            "type": "string"
          },
          "errorCode": {
            "type": "string"
          }
        },
        "required": [
          "eventType",
          "eventId",
          "schemaVersion",
          "organizationId",
          "callId",
          "analysisSessionId",
          "trackBindingId",
          "eventSequence",
          "windowSequence",
          "revision",
          "evidenceType",
          "windowStartMs",
          "windowEndMs",
          "observedAt"
        ]
      },
      "PutRiskPolicyDto": {
        "type": "object",
        "properties": {
          "version": {
            "type": "string",
            "maxLength": 40
          },
          "schemaVersion": {
            "type": "string",
            "maxLength": 40,
            "example": "1.0.0"
          },
          "policyDocument": {
            "type": "object",
            "additionalProperties": true
          },
          "activate": {
            "type": "boolean",
            "description": "Activate this immutable version after creation."
          }
        },
        "required": [
          "version",
          "schemaVersion",
          "policyDocument",
          "activate"
        ]
      },
      "CreateVerificationChallengeDto": {
        "type": "object",
        "properties": {
          "method": {
            "type": "string",
            "enum": [
              "CALLBACK",
              "OUT_OF_BAND"
            ]
          }
        },
        "required": [
          "method"
        ]
      },
      "CompleteVerificationChallengeDto": {
        "type": "object",
        "properties": {
          "organizationId": {
            "type": "string",
            "format": "uuid"
          },
          "result": {
            "type": "string",
            "enum": [
              "PASSED",
              "FAILED"
            ]
          },
          "resultCode": {
            "type": "string",
            "maxLength": 80
          }
        },
        "required": [
          "organizationId",
          "result",
          "resultCode"
        ]
      },
      "ReleaseInterventionDto": {
        "type": "object",
        "properties": {
          "verificationChallengeId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "verificationChallengeId"
        ]
      },
      "ErrorEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestId": {
            "type": "string"
          },
          "details": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "AuthSession": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "accessToken",
          "refreshToken",
          "tokenType",
          "expiresIn",
          "principal"
        ],
        "properties": {
          "accessToken": {
            "type": "string",
            "readOnly": true,
            "x-swar-sensitive": true
          },
          "refreshToken": {
            "type": "string",
            "readOnly": true,
            "x-swar-sensitive": true
          },
          "tokenType": {
            "type": "string",
            "enum": [
              "Bearer"
            ]
          },
          "expiresIn": {
            "type": "integer",
            "minimum": 1
          },
          "principal": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "userId",
              "membershipId",
              "organizationId",
              "deviceId",
              "roles"
            ],
            "properties": {
              "userId": {
                "type": "string",
                "format": "uuid"
              },
              "membershipId": {
                "type": "string",
                "format": "uuid"
              },
              "organizationId": {
                "type": "string",
                "format": "uuid"
              },
              "deviceId": {
                "type": "string",
                "format": "uuid"
              },
              "roles": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              }
            }
          }
        }
      },
      "Call": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "callId",
          "status",
          "riskPolicyVersion",
          "createdAt",
          "startedAt",
          "endedAt"
        ],
        "properties": {
          "callId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "enum": [
              "AUTHORIZED",
              "ACTIVE",
              "ENDING",
              "ENDED",
              "CANCELLED",
              "FAILED"
            ]
          },
          "riskPolicyVersion": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "startedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "endedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        }
      },
      "JoinGrant": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "roomName",
          "participantIdentity",
          "joinToken",
          "expiresAt"
        ],
        "properties": {
          "roomName": {
            "type": "string"
          },
          "participantIdentity": {
            "type": "string"
          },
          "joinToken": {
            "type": "string",
            "readOnly": true,
            "x-swar-sensitive": true
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ParticipantGrant": {
        "allOf": [
          {
            "$ref": "#/components/schemas/JoinGrant"
          },
          {
            "type": "object",
            "required": [
              "participantId",
              "role"
            ],
            "properties": {
              "participantId": {
                "type": "string",
                "format": "uuid"
              },
              "role": {
                "enum": [
                  "CALLER",
                  "CUSTOMER",
                  "OBSERVER"
                ]
              }
            }
          }
        ]
      },
      "RiskEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "riskEventId",
          "callId",
          "eventSequence",
          "priorState",
          "state",
          "reasonCode",
          "policyVersion",
          "thresholdVersion",
          "occurredAt"
        ],
        "properties": {
          "riskEventId": {
            "type": "string",
            "format": "uuid"
          },
          "callId": {
            "type": "string",
            "format": "uuid"
          },
          "eventSequence": {
            "type": "string",
            "pattern": "^\\d+$"
          },
          "priorState": {
            "enum": [
              "VERIFIED",
              "UNVERIFIED",
              "HIGH_RISK",
              "CRITICAL"
