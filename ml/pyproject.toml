[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swar-ml"
version = "0.1.0"
description = "SWAR FastAPI analysis-service foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "training*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
