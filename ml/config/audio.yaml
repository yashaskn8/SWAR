{
  "schema_version": "1.0.0",
  "config_version": "phase-l-audio-v1",
  "canonical": {
    "sample_rate_hz": 16000,
    "channels": 1,
    "dtype": "float32",
    "pcm_scale": 32768.0
  },
  "input": {
    "allowed_sample_rates_hz": [8000, 16000, 24000, 32000, 44100, 48000],
    "max_channels": 2,
    "max_frame_duration_ms": 1000,
    "max_input_bytes": 384000,
    "max_file_bytes": 268435456,
    "allowed_file_containers": ["WAV", "FLAC"],
    "allowed_file_subtypes": ["PCM_16"]
  },
  "resampling": {
    "library": "python-soxr",
    "quality": "HQ"
  },
  "window": {
    "duration_ms": 4000,
    "stride_ms": 1000,
    "max_buffer_ms": 8000,
    "final_partial_policy": "emit_insufficient"
  },
  "vad": {
    "frame_ms": 20,
    "speech_rms_dbfs_threshold": -42.0,
    "minimum_speech_ms": 1000
  },
  "quality": {
    "clipping_amplitude_threshold": 0.999,
    "clipped_sample_ratio_threshold": 0.01,
    "low_level_rms_dbfs_threshold": -50.0,
    "excess_silence_ratio_threshold": 0.80,
    "spectral_frame_ms": 25,
    "noise_spectral_flatness_threshold": 0.65
  }
}
